<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allon Mureinik — Public Speaking</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1c1f26;
      --border: #2d3140;
      --text: #e2e4ea;
      --text-muted: #8b8fa8;
      --accent-1: #7c6af7;
      --accent-2: #f77c6a;
      --accent-3: #6af7c0;
      --accent-4: #f7c26a;

      /* One colour per tag category, in the order public_speaking.json lists
         them. They are numbered rather than named after the categories so that
         renaming a category in the data cannot silently un-colour it. */
      --cat-1: #ff8a75;
      --cat-2: #9d8cff;
      --cat-3: #5fe3c0;
      --cat-4: #f5c56a;
      --cat-5: #ff8ad0;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --border: #d0d7de;
        --text: #0d1117;
        --text-muted: #57606a;
        --accent-1: #6a4dd7;
        --accent-2: #d1451b;
        --accent-3: #1a7e5f;
        --accent-4: #d4a000;

        /* Darker mixes of the same five hues. No single colour clears 4.5:1
           against both #0f1117 and #ffffff - the two requirements exclude each
           other - so each scheme gets its own palette, as the accents do. */
        --cat-1: #c0392b;
        --cat-2: #5b43c9;
        --cat-3: #0f7a5f;
        --cat-4: #8a6100;
        --cat-5: #b02a7a;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }

    header {
      padding: 3rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 600;
    }

    header p {
      margin: 0.5rem 0 0;
      color: var(--text-muted);
    }

    section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    h2 {
      margin: 2rem 0 1rem;
      font-size: 1.5rem;
      font-weight: 600;
    }

    /* Cloud Section */
    #cloud-section {
      text-align: center;
    }

    #wc-canvas {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* The canvas cannot say what its colours mean, so the legend does. */
    #wc-legend {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1.25rem;
      margin: 1rem 0 0;
      padding: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    #wc-legend li {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Each entry narrows the cloud to its own category, so it has to be a real
       button: reachable by keyboard, and with its state in aria-pressed. */
    #wc-legend button {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.5rem;
      background: none;
      border: 1px solid transparent;
      border-radius: 4px;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: opacity 0.2s, border-color 0.2s, color 0.2s;
    }

    #wc-legend button:hover,
    #wc-legend button[aria-pressed="true"] {
      border-color: var(--border);
      color: var(--text);
    }

    /* While one category is selected the others recede, so a cloud with five
       words missing reads as filtered rather than broken. */
    #wc-legend button.dimmed {
      opacity: 0.45;
    }

    .wc-swatch {
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    #wc-a11y {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .wc-tag-btn {
      padding: 0.4rem 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .wc-tag-btn:hover {
      background: var(--accent-1);
      border-color: var(--accent-1);
      color: var(--bg);
    }

    /* Timeline Section */
    #year-chart {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      height: 150px;
      margin: 2rem 0;
    }

    .year-bar {
      flex: 1;
      background: var(--accent-1);
      border-radius: 4px 4px 0 0;
      position: relative;
      min-height: 4px;
      transition: all 0.2s;
    }

    .year-bar:hover {
      background: var(--accent-4);
    }

    .year-bar.selected {
      background: var(--accent-4);
      box-shadow: 0 0 0 2px var(--accent-1);
    }

    .year-label {
      position: absolute;
      bottom: -1.5rem;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Talks Section */
    #filter-controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-group label {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .filter-group select {
      padding: 0.4rem 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .filter-group select:hover {
      border-color: var(--accent-1);
    }

    #filter-bar {
      display: none;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      background: var(--accent-4);
      color: var(--bg);
      border-radius: 4px;
      margin-left: auto;
      font-size: 0.9rem;
    }

    #filter-bar.active {
      display: flex;
    }

    .clear-filter {
      padding: 0.3rem 0.6rem;
      background: var(--bg);
      color: var(--accent-4);
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .clear-filter:hover {
      opacity: 0.8;
    }

    #talk-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1.5rem;
    }

    .talk-card {
      padding: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: none;
    }

    .talk-card.visible {
      display: block;
    }

    .talk-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .talk-conference {
      font-weight: 600;
      color: var(--accent-2);
    }

    .talk-date {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .hebrew-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      background: var(--accent-3);
      color: var(--bg);
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .talk-link.archived,
    .talk-conference.archived,
    .talk-title a.archived,
    .talk-link.gated,
    .talk-conference.gated,
    .talk-title a.gated {
      text-decoration: underline dashed;
      text-underline-offset: 2px;
      cursor: help;
    }

    .talk-link.archived,
    .talk-conference.archived,
    .talk-title a.archived {
      opacity: 0.75;
    }

    .talk-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0.5rem 0;
      color: var(--text);
    }

    .talk-title a {
      color: var(--accent-1);
      text-decoration: none;
    }

    .talk-title a:hover {
      text-decoration: underline;
    }

    .talk-meta {
      display: flex;
      gap: 1rem;
      margin: 0.75rem 0;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .talk-link {
      color: var(--accent-1);
      text-decoration: none;
      padding: 0.2rem 0.6rem;
      background: var(--bg);
      border-radius: 3px;
      display: inline-block;
      transition: all 0.2s;
    }

    .talk-link:hover {
      background: var(--accent-1);
      color: var(--bg);
    }

    .talk-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .tag-pill {
      padding: 0.3rem 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text);
    }

    .tag-pill:hover {
      background: var(--accent-1);
      border-color: var(--accent-1);
      color: var(--bg);
    }

    .tag-pill.topic {
      border-color: var(--accent-1);
    }

    .tag-pill.conference {
      border-color: var(--accent-2);
    }

    .tag-pill.hebrew {
      border-color: var(--accent-3);
    }

    footer {
      padding: 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-1);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8rem;
      }

      section {
        padding: 1rem;
      }

      #year-chart {
        height: 100px;
      }

      .year-label {
        bottom: -1.2rem;
        font-size: 0.7rem;
      }

      #filter-controls {
        flex-direction: column;
        align-items: stretch;
      }

      #filter-bar {
        margin-left: 0;
        width: 100%;
        justify-content: space-between;
      }

      #talk-list {
        gap: 1rem;
      }

      .talk-card {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Allon Mureinik</h1>
    <p>Public Speaking</p>
  </header>

  <section id="cloud-section">
    <h2>Topics &amp; Conferences</h2>
    <canvas id="wc-canvas" width="800" height="400"></canvas>
    <ul id="wc-legend"></ul>
    <div id="wc-a11y" class="sr-only"></div>
  </section>

  <section id="timeline-section">
    <h2>Timeline</h2>
    <div id="year-chart"></div>
  </section>

  <section id="talks-section">
    <h2>Talks</h2>
    <div id="filter-controls">
      <div class="filter-group">
        <label for="language-filter">Language:</label>
        <select id="language-filter">
          <option value="">All</option>
          <option value="Hebrew">Hebrew</option>
          <option value="English">English</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="conference-filter">Conference:</label>
        <select id="conference-filter">
          <option value="">All</option>
        </select>
      </div>
      <div id="filter-bar">
        <span>Topic:</span>
        <strong id="filter-tag"></strong>
        <button type="button" class="clear-filter">✕ Clear</button>
      </div>
    </div>
    <ul id="talk-list"></ul>
  </section>

  <footer>
    <p>Back to <a href="/mureinik/">profile</a> | <a href="public_speaking.md">source</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
  <script>
    let allTalks = [];
    let topicTags = new Set();
    let currentTopicFilter = null;
    let currentCategoryFilter = null;
    let currentLanguageFilter = null;
    let currentConferenceFilter = null;
    let currentYearFilter = null;

    // Both "requiresLogin" and "archived" name the individual links they apply
    // to, rather than the whole talk: a talk can pair a gated conference page
    // with a public SlideShare deck, or a dead one with a live recording.
    const ARCHIVE_MARKER = '\u{1F5C4}\uFE0F';
    const ARCHIVE_TITLE = 'Archived copy - the original page is gone';
    const LOGIN_MARKER = '\u{1F512}';
    const LOGIN_TITLE = 'Requires a login to view';

    const snapshot = (talk, field) => (talk.archived || {})[field];
    const isGated = (talk, field) => (talk.requiresLogin || []).includes(field);
    const linkUrl = (talk, field) => {
      const ts = snapshot(talk, field);
      return ts ? `https://web.archive.org/web/${ts}/${talk[field]}` : talk[field];
    };
    // A gone page outranks a gated one: no login gets you into a host that is down.
    const linkState = (talk, field) => {
      if (snapshot(talk, field)) return { cls: 'archived', title: ARCHIVE_TITLE, marker: ARCHIVE_MARKER };
      if (isGated(talk, field)) return { cls: 'gated', title: LOGIN_TITLE, marker: LOGIN_MARKER };
      return null;
    };
    const linkAttrs = (talk, field, cls) => {
      const state = linkState(talk, field);
      const classes = [cls, state ? state.cls : ''].filter(Boolean).join(' ');
      const title = state ? ` title="${state.title}"` : '';
      return `${classes ? ` class="${classes}"` : ''}${title}`;
    };
    const linkLabel = (talk, field, label) => {
      const state = linkState(talk, field);
      return state ? `${label} ${state.marker}` : label;
    };

    function buildTagWeights(talks) {
      const tagCount = {};
      talks.forEach(talk => {
        talk.tags.forEach(tag => {
          if (topicTags.has(tag)) {
            tagCount[tag] = (tagCount[tag] || 0) + 1;
          }
        });
      });

      const weights = Object.entries(tagCount)
        .map(([tag, count]) => [tag, count])
        .sort((a, b) => b[1] - a[1]);

      return weights;
    }

    // The cloud encodes two things at once: a word's size is its talk count, and
    // its colour is the category the tag belongs to. Colour used to rank the
    // count as well, which told you nothing the size had not already said.
    //
    // Categories are coloured by their position in public_speaking.json, so the
    // data decides both the grouping and the order. A sixth category with no
    // colour of its own, or a tag in none, falls back to the muted text colour -
    // the page keeps rendering, and scripts/check_tag_categories.js is what
    // actually keeps the two halves of the JSON in step.
    const CATEGORY_VARS = ['--cat-1', '--cat-2', '--cat-3', '--cat-4', '--cat-5'];
    const UNCATEGORISED_VAR = '--text-muted';

    let categoryOfTag = new Map();
    let varOfCategory = new Map();

    function indexCategories(tagCategories) {
      categoryOfTag = new Map();
      varOfCategory = new Map();

      Object.entries(tagCategories || {}).forEach(([category, tags], index) => {
        varOfCategory.set(category, CATEGORY_VARS[index] || UNCATEGORISED_VAR);
        tags.forEach(tag => categoryOfTag.set(tag, category));
      });
    }

    const varOfTag = (tag) =>
      varOfCategory.get(categoryOfTag.get(tag)) || UNCATEGORISED_VAR;

    // Resolved to concrete colours here because a canvas cannot take a var().
    // The legend can, which is why its swatches survive a colour-scheme flip
    // on their own while the canvas has to be repainted.
    function getTagColors(weights) {
      const styles = getComputedStyle(document.documentElement);
      return new Map(weights.map(([tag]) =>
        [tag, styles.getPropertyValue(varOfTag(tag)).trim()]));
    }

    function renderLegend() {
      const legend = document.getElementById('wc-legend');
      legend.innerHTML = '';

      varOfCategory.forEach((cssVar, category) => {
        const item = document.createElement('li');
        const btn = document.createElement('button');
        const selected = category === currentCategoryFilter;

        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(selected));
        btn.classList.toggle('dimmed', currentCategoryFilter !== null && !selected);
        btn.addEventListener('click', () => toggleCategory(category));

        const swatch = document.createElement('span');
        swatch.className = 'wc-swatch';
        swatch.style.background = `var(${cssVar})`;
        btn.appendChild(swatch);
        btn.appendChild(document.createTextNode(category));

        item.appendChild(btn);
        legend.appendChild(item);
      });
    }

    // Selecting a category narrows the cloud to its tags; selecting it again
    // restores the rest. The talk list is deliberately left alone - clicking a
    // word in the narrowed cloud is what filters the talks, as it always was.
    function toggleCategory(category) {
      currentCategoryFilter = currentCategoryFilter === category ? null : category;
      renderLegend();
      paintCloud();
    }

    // Every repaint goes through here - first load, resize, colour-scheme flip
    // and the legend - so none of them can quietly restore tags the viewer
    // filtered out.
    function paintCloud() {
      renderCloud(buildTagWeights(allTalks).filter(([tag]) =>
        !currentCategoryFilter || categoryOfTag.get(tag) === currentCategoryFilter));
    }

    function renderCloud(weights) {
      const list = weights.map(([tag, count]) => [tag, count * 5]);
      const colors = getTagColors(weights);

      WordCloud(document.getElementById('wc-canvas'), {
        list,
        gridSize: 16,
        weightFactor(size) {
          return size * 2;
        },
        color: (word) => colors.get(word),
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg'),
        minSize: 12,
        click(item) {
          filterByTopic(item[0]);
        },
        shrinkToFit: true,
        rotateRatio: 0.1
      });

      // Populate a11y buttons
      const a11yContainer = document.getElementById('wc-a11y');
      a11yContainer.innerHTML = '';
      // Colour and size are both invisible here, so the label spells out what
      // they encode: the category and the talk count.
      weights.forEach(([tag, count]) => {
        const btn = document.createElement('button');
        btn.className = 'wc-tag-btn sr-only';
        btn.textContent = tag;
        const category = categoryOfTag.get(tag);
        const talks = `${count} ${count === 1 ? 'talk' : 'talks'}`;
        btn.setAttribute('aria-label',
          `Filter by ${tag}${category ? `, ${category}` : ''}, ${talks}`);
        btn.addEventListener('click', () => filterByTopic(tag));
        a11yContainer.appendChild(btn);
      });
    }

    function renderYearChart(talks) {
      const yearCounts = {};
      talks.forEach(talk => {
        const year = new Date(talk.date).getFullYear();
        yearCounts[year] = (yearCounts[year] || 0) + 1;
      });

      const years = Object.keys(yearCounts).map(Number).sort();
      const maxCount = Math.max(...Object.values(yearCounts));
      const container = document.getElementById('year-chart');
      container.innerHTML = '';

      years.forEach(year => {
        const count = yearCounts[year];
        const height = (count / maxCount) * 100;
        const bar = document.createElement('div');
        bar.className = 'year-bar';
        bar.style.height = `${height}%`;
        bar.title = `${year}: ${count} talks`;
        bar.dataset.year = year;
        bar.style.cursor = 'pointer';
        bar.addEventListener('click', () => filterByYear(year));
        const label = document.createElement('div');
        label.className = 'year-label';
        label.textContent = year;
        bar.appendChild(label);
        container.appendChild(bar);
      });
    }

    function renderTalkList(talks) {
      const list = document.getElementById('talk-list');
      list.innerHTML = '';

      talks.forEach(talk => {
        const card = document.createElement('li');
        card.className = 'talk-card visible';
        card.dataset.id = talk.id;
        card.dataset.topicTags = JSON.stringify(talk.tags);
        card.dataset.language = talk.language;
        card.dataset.conference = talk.conference;
        card.dataset.year = new Date(talk.date).getFullYear();

        let headerHTML = `<div class="talk-header">`;
        const year = new Date(talk.date).getFullYear();
        const displayConference = talk.subname || `${talk.conference} ${year}`;
        if (talk.conferenceUrl) {
          headerHTML += `<a href="${linkUrl(talk, 'conferenceUrl')}"${linkAttrs(talk, 'conferenceUrl', 'talk-conference')}>${linkLabel(talk, 'conferenceUrl', escapeHtml(displayConference))}</a>`;
        } else {
          headerHTML += `<span class="talk-conference">${escapeHtml(displayConference)}</span>`;
        }
        headerHTML += `<span class="talk-date">${talk.dateDisplay}</span>`;
        if (talk.language === 'Hebrew') {
          headerHTML += `<span class="hebrew-badge">Hebrew</span>`;
        }
        headerHTML += `</div>`;

        let titleHTML = `<div class="talk-title">`;
        if (talk.talkUrl) {
          titleHTML += `<a href="${linkUrl(talk, 'talkUrl')}"${linkAttrs(talk, 'talkUrl', '')}>${linkLabel(talk, 'talkUrl', escapeHtml(talk.title))}</a>`;
        } else {
          titleHTML += escapeHtml(talk.title);
        }
        titleHTML += `</div>`;

        let metaHTML = `<div class="talk-meta">`;
        const mediaLink = (field, label) =>
          `<a href="${linkUrl(talk, field)}"${linkAttrs(talk, field, 'talk-link')}>${linkLabel(talk, field, label)}</a>`;
        if (talk.slides) {
          metaHTML += mediaLink('slides', '📊 Slides');
        }
        if (talk.recording) {
          metaHTML += mediaLink('recording', '🎬 Recording');
        }
        if (talk.code) {
          metaHTML += mediaLink('code', '💻 Code');
        }
        metaHTML += `</div>`;

        let tagsHTML = `<div class="talk-tags">`;
        talk.tags.forEach(tag => {
          if (topicTags.has(tag)) {
            tagsHTML += `<button class="tag-pill topic" data-tag="${tag}">${tag}</button>`;
          }
        });
        tagsHTML += `</div>`;

        card.innerHTML = headerHTML + titleHTML + metaHTML + tagsHTML;

        // Add tag click listeners
        card.querySelectorAll('[data-tag]').forEach(btn => {
          btn.addEventListener('click', () => filterByTopic(btn.dataset.tag));
        });

        list.appendChild(card);
      });
    }

    function filterByTopic(tag) {
      currentTopicFilter = tag;
      applyFilters();

      const filterBar = document.getElementById('filter-bar');
      const filterTag = document.getElementById('filter-tag');
      filterBar.classList.add('active');
      filterTag.textContent = tag;

      document.getElementById('talks-section').scrollIntoView({ behavior: 'smooth' });
    }

    function applyFilters() {
      const cards = document.querySelectorAll('.talk-card');

      cards.forEach(card => {
        let visible = true;

        // Topic filter
        if (currentTopicFilter) {
          const cardTopicTags = JSON.parse(card.dataset.topicTags);
          if (!cardTopicTags.includes(currentTopicFilter)) {
            visible = false;
          }
        }

        // Language filter
        if (visible && currentLanguageFilter) {
          if (card.dataset.language !== currentLanguageFilter) {
            visible = false;
          }
        }

        // Conference filter
        if (visible && currentConferenceFilter) {
          if (card.dataset.conference !== currentConferenceFilter) {
            visible = false;
          }
        }

        // Year filter
        if (visible && currentYearFilter) {
          if (parseInt(card.dataset.year) !== currentYearFilter) {
            visible = false;
          }
        }

        card.classList.toggle('visible', visible);
      });

      updateFilterBar();
    }

    function updateFilterBar() {
      const filterBar = document.getElementById('filter-bar');
      if (currentTopicFilter) {
        filterBar.classList.add('active');
      } else {
        filterBar.classList.remove('active');
      }
    }

    function filterByYear(year) {
      currentYearFilter = year;
      applyFilters();

      // Highlight selected year bar
      document.querySelectorAll('.year-bar').forEach(bar => {
        bar.classList.toggle('selected', parseInt(bar.dataset.year) === year);
      });
    }

    function clearAllFilters() {
      currentTopicFilter = null;
      currentLanguageFilter = null;
      currentConferenceFilter = null;
      currentYearFilter = null;
      document.getElementById('language-filter').value = '';
      document.getElementById('conference-filter').value = '';
      document.querySelectorAll('.year-bar').forEach(bar => {
        bar.classList.remove('selected');
      });
      applyFilters();
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    async function init() {
      try {
        const response = await fetch('public_speaking.json');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        // Extract talks
        allTalks = data.talks;

        // Build topic tags set from all talks
        const allTagsSet = new Set();
        allTalks.forEach(talk => {
          talk.tags.forEach(tag => {
            allTagsSet.add(tag);
          });
        });
        topicTags = allTagsSet;

        // Sort by date descending
        allTalks.sort((a, b) => new Date(b.date) - new Date(a.date));

        indexCategories(data.tagCategories);
        renderLegend();

        paintCloud();
        renderYearChart(allTalks);
        renderTalkList(allTalks);

        // Populate conference dropdown
        const conferences = [...new Set(allTalks.map(t => t.conference))].sort();
        const conferenceSelect = document.getElementById('conference-filter');
        conferences.forEach(conf => {
          const option = document.createElement('option');
          option.value = conf;
          option.textContent = conf;
          conferenceSelect.appendChild(option);
        });

        // Event listeners
        document.getElementById('language-filter').addEventListener('change', (e) => {
          currentLanguageFilter = e.target.value || null;
          applyFilters();
        });

        document.getElementById('conference-filter').addEventListener('change', (e) => {
          currentConferenceFilter = e.target.value || null;
          applyFilters();
        });

        const clearBtn = document.querySelector('.clear-filter');
        clearBtn.addEventListener('click', clearAllFilters);
        clearBtn.textContent = '✕ Clear all filters';

        // Handle window resize for cloud
        let resizeTimeout;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(paintCloud, 300);
        });

        // The cloud is pixels, not elements: its colours and background are read
        // out of the stylesheet once, at paint time, so a scheme flip with the
        // page open would otherwise leave the old palette on the canvas until
        // something else happened to repaint it.
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', paintCloud);
      } catch (error) {
        console.error('Failed to load talks:', error);
        document.getElementById('talk-list').innerHTML = '<li><p>Error loading talks data.</p></li>';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
