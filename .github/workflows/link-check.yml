name: Link check

# Two things can be wrong with a link in public_speaking.json, and this checks
# for both. It can stop answering - conference sites outlive their conference by
# only a few years, and rot quietly - or it can answer perfectly well while
# belonging to a different talk, which no amount of fetching will reveal.
#
# For the first: links the JSON already accounts for are skipped, since a field
# listed in a talk's "archived" map has a host that is known to be gone and one
# listed in "requiresLogin" answers only for a signed-in visitor. Checking
# either would just re-report what the data already records.
#
# For the second: a recording, deck, session page or repository belongs to one
# talk. Conference pages are exempt, because several talks at one conference
# share one by definition.
#
# Fixing either means editing public_speaking.json - and for a dead link, prefer
# an "archived" entry over deleting the URL, per "Links rot" in CLAUDE.md.

on:
  schedule:
    # Mondays, 06:00 UTC. Only runs from the default branch.
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - public_speaking.json
      - scripts/check_links.js
      - scripts/check_duplicate_links.js
      - .github/workflows/link-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Independent of the job below rather than gating it, so a pull request that
  # both duplicates a link and breaks another reports both faults at once.
  duplicate-links:
    name: Talk links are not duplicated
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: scripts/package.json

      - name: Check for duplicated links
        run: node scripts/check_duplicate_links.js

  check-links:
    name: Talk links are alive
    runs-on: ubuntu-24.04
    # The script bounds each request and its retries, so a normal run takes well
    # under a minute. This is a backstop against a pathological one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Same pin the other workflows read. There is no "npm ci" step: the script
      # uses the built-in fetch and declares no dependencies.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: scripts/package.json

      - name: Check the talk links
        run: node scripts/check_links.js
