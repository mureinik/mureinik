name: Talks markdown

# public_speaking.md is generated from public_speaking.json by
# scripts/generate_md.js. This verifies the committed markdown matches what the
# generator produces, so a pull request cannot change a source and leave the
# rendered list behind.
#
# The check only reports: it regenerates into the runner's workspace to compare,
# and never commits or pushes the result. Fixing a failure is the author's job -
# run `node scripts/generate_md.js` locally and commit the result.

on:
  pull_request:
    paths:
      - public_speaking.json
      - scripts/generate_md.js
      - public_speaking.md
      # For engines.node: the generator formats dates through
      # toLocaleDateString, so a Node bump can shift its output and needs the
      # same check as a change to the generator itself. A path filter cannot
      # look inside a file, so this runs on any edit to the manifest - a bin
      # entry, a Dependabot version bump - and not only on the pin. That is
      # deliberate. The check takes seconds, and the alternative is a Node bump
      # silently changing a generated file nobody reads.
      - scripts/package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated-markdown:
    name: public_speaking.md is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The version itself is pinned by "engines.node" in scripts/package.json,
      # so the generator runs here on the same Node it is developed against.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: scripts/package.json

      - name: Regenerate the markdown
        run: node scripts/generate_md.js

      - name: Compare against the committed file
        run: |
          if ! git diff --exit-code -- public_speaking.md; then
            echo "::error file=public_speaking.md::public_speaking.md does not match what scripts/generate_md.js produces from public_speaking.json. Run 'node scripts/generate_md.js' and commit the result."
            exit 1
          fi
          echo "public_speaking.md matches the generator output."
