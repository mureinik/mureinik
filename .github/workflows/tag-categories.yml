name: Tag categories

# The topic cloud in public_speaking.html encodes two things at once: a tag's
# size is the number of talks carrying it, and its color is the category it
# belongs to. The categories live in public_speaking.json, in "tagCategories",
# beside the talks that use the tags.
#
# That only works while the two halves of the file name exactly the same tags.
# A tag a talk uses but no category names has no color to paint - it renders
# gray, which reads as a category of its own - and a tag two categories name
# has no single one to paint it. The legend is drawn from the categories, so it
# makes the same demand in reverse: a category no talk uses is a swatch that
# explains nothing.
#
# Nothing about adding a talk prompts anyone to revisit the map, so this checks.
# Unlike the link check there is no schedule: a tag cannot fall out of its
# category unattended, so the file changing is the only thing worth checking.

on:
  pull_request:
    paths:
      - public_speaking.json
      - scripts/check_tag_categories.js
      - .github/workflows/tag-categories.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-categories:
    name: Every tag is in exactly one category
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # Same pin the other workflows read. There is no "npm ci" step: the
      # script reads the JSON and declares no dependencies.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: scripts/package.json

      - name: Check the tag categories
        run: node scripts/check_tag_categories.js
